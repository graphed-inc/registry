slug: __PROJECT_SLUG__
name: __PROJECT_NAME__

# Scaffold provenance. The Graphed CLI reads this to check plugin
# compatibility; it is stripped on deploy and never sent to the server.
scaffold:
  name: base
  version: 0.1.0

databases:
  primary:
    env: DATABASE_URL

release:
  command: npm run db:migrate
  timeout_seconds: 600
  retries: 1

services:
  dashboard:
    command: node packages/dashboard/.next/standalone/packages/dashboard/server.js
    port: 3000
    healthcheck: /api/health
    # Services are private by default — reaching this dashboard requires
    # Graphed authentication. Opt specific routes into public access
    # explicitly (e.g. webhooks), never the whole app:
    #   public:
    #     paths:
    #       - ^/api/webhooks/.*

jobs:
  example-daily:
    command: npm run job:example-daily
    schedule:
      cron: 0 13 * * *
      timezone: America/New_York
    timeout_seconds: 900
    retries: 1
