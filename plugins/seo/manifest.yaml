# Fragment merged into graphed.yaml by `graphed plugins add seo --apply-manifest`.
#
# No vendor API keys. GRAPHED_TOKEN / GRAPHED_WAREHOUSE_URL / GRAPHED_TOOLS_URL
# are injected by the runtime. Article drafting uses Graphed Tools OpenRouter,
# and SERP research uses serper:search and exa:search on the same proxy.
# Variables with code defaults (OPENROUTER_MODEL, SEO_CONFIG_PATH) are NOT
# declared — listing them would block deploy with waiting_for_secrets.
#
# Secrets are injected only for names in a job's env list — setting an
# undeclared name with `graphed secrets set` has NO effect at runtime. To
# override a code default, BOTH steps are required:
#   1. Add the name to this job's env list (e.g. `- OPENROUTER_MODEL`)
#   2. `graphed secrets set OPENROUTER_MODEL` (then redeploy)
#
# After integrating, add the chosen CMS to BOTH jobs' env lists:
#   ghost:     GHOST_API_URL, GHOST_ADMIN_API_KEY
#   wordpress: WP_URL, WP_USERNAME, WP_APPLICATION_PASSWORD
#   strapi:    STRAPI_API_URL, STRAPI_API_TOKEN
#   none:      nothing to add
#
# seo-refresh is audit-only until SEO_REFRESH_APPLY=true. That name is a code
# default (false), so it is not listed here — listing it would block deploy.
# To turn writes on: add `- SEO_REFRESH_APPLY` under seo-refresh.env, then
# `graphed secrets set SEO_REFRESH_APPLY`. Same pattern for SEO_REFRESH_BATCH,
# SEO_REFRESH_THIN_WORD_THRESHOLD, SEO_REFRESH_MIN_AGE_DAYS, SEO_GAP_MODEL,
# and SEO_REFRESH_MODEL.
jobs:
  seo-publish-daily:
    command: npm run job:seo-publish-daily
    schedule:
      cron: 0 12 * * *
      timezone: America/New_York
    # No automatic retries: a failed run stays visible in the queue and is
    # re-claimable by the next scheduled run (or "Run now" in the dashboard).
    retries: 0
    timeout_seconds: 1800
  # Published-article loop: Search Console 28d metrics (when configured) →
  # keyword SERP → ranking-page text → gap comparison → expand/refresh/dedupe/leave.
  # Audit-only unless SEO_REFRESH_APPLY=true. Titles and slugs stay frozen.
  seo-refresh:
    command: npm run job:seo-refresh
    schedule:
      cron: 0 6 * * *
      timezone: America/New_York
    retries: 0
    timeout_seconds: 5400
