name: seo
version: 0.3.0
kind: channel
summary: SEO agent — keyword queue, AI article drafts, CMS publishing, published-article refresh, dashboard overview
description: >
  A daily job that pulls the next keyword from a queue, drafts a
  publication-ready article through Graphed Tools (OpenRouter proxy, Serper,
  and Exa — no vendor API keys), and publishes it to Ghost, WordPress, or
  Strapi. A second daily job audits published articles against Search
  Console and the live SERP, and rewrites them when SEO_REFRESH_APPLY is
  set. Ships with a /seo dashboard console: Search Console metrics funnel,
  keyword queue, run-now, article reader, unpublish, and CSV import.
keywords:
  - seo
  - content
  - blog
  - articles
  - ghost
  - wordpress
  - strapi
  - organic

requires:
  databases:
    - primary

secrets:
  - name: GHOST_API_URL
    description: Ghost site URL, e.g. https://blog.example.com (cms.type = ghost)
    required: false
  - name: GHOST_ADMIN_API_KEY
    description: Ghost Admin API key in id:secret format (cms.type = ghost)
    required: false
  - name: WP_URL
    description: WordPress site URL (cms.type = wordpress)
    required: false
  - name: WP_USERNAME
    description: WordPress user with an application password (cms.type = wordpress)
    required: false
  - name: WP_APPLICATION_PASSWORD
    description: WordPress application password (cms.type = wordpress)
    required: false
  - name: STRAPI_API_URL
    description: Strapi base URL, e.g. https://<name>.strapiapp.com (cms.type = strapi)
    required: false
  - name: STRAPI_API_TOKEN
    description: Strapi full-access API token from Settings -> API Tokens (cms.type = strapi)
    required: false

# Drafting and SERP research use the Graphed tools proxy. GRAPHED_TOKEN and
# GRAPHED_TOOLS_URL are injected by the runtime — do not declare them, and
# do not ask for OpenRouter, Serper, or Exa API keys.
# Secrets are injected only for names in a job's env list in graphed.yaml —
# overriding these defaults requires adding the name to the job's env list
# AND `graphed secrets set <NAME>` (see manifest.yaml header). Refresh-only
# defaults (SEO_REFRESH_APPLY, batch size, models) live in code the same way.
env:
  - name: OPENROUTER_MODEL
    default: anthropic/claude-sonnet-4.5
    description: Model id on the Graphed Tools OpenRouter proxy (no API key)
  - name: SEO_CONFIG_PATH
    default: clients/seo/client.config.json
    description: Path to the client config (brand voice, audience, CMS selection)

provides:
  jobs:
    - seo-publish-daily
    - seo-refresh
  dashboardRoutes:
    - /seo

compat:
  scaffold: ">=0.1.0"
